apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: verify-image-signature-and-sbom }
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: require-cosign-signature-and-sbom
      match: { any: [{ resources: { kinds: [Pod], namespaces: ["secure-app","validation"] } }] }
      verifyImages:
        - imageReferences: ["ghcr.io/ORG/REPO/*"]
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/ORG/REPO/.github/workflows/pipeline.yml@refs/heads/main
                    rekor: { url: https://rekor.sigstore.dev }
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: https://github.com/ORG/REPO/.github/workflows/pipeline.yml@refs/heads/main
