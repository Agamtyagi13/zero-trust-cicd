apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: supply-chain-baseline }
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: only-trusted-registry
      match: { any: [{ resources: { kinds: [Pod], namespaces: ["secure-app","validation"] } }] }
      validate:
        message: "Images must come from ghcr.io/ORG/REPO/."
        pattern: { spec: { containers: [{ image: "ghcr.io/ORG/REPO/*" }] } }
    - name: disallow-latest-tag
      match: { any: [{ resources: { kinds: [Pod] } }] }
      validate:
        message: "':latest' tag is blocked; pin by digest."
        pattern: { spec: { containers: [{ image: "!*:latest" }] } }
    - name: require-non-root
      match: { any: [{ resources: { kinds: [Pod], namespaces: ["secure-app","validation"] } }] }
      validate:
        message: "Containers must run as non-root."
        pattern: { spec: { securityContext: { runAsNonRoot: true } } }
    - name: disallow-privileged
      match: { any: [{ resources: { kinds: [Pod] } }] }
      validate:
        message: "Privileged containers are blocked."
        pattern: { spec: { containers: [{ =(securityContext): { =(privileged): false } }] } }
